<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Projetos</title>
<link rel="icon" type="image/svg+xml" href="/assets/central-icon.svg">
<link rel="stylesheet" href="/assets/primeicons.css">
<link rel="stylesheet" href="/assets/inicio.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><img src="/assets/central-icon.svg" alt=""><div><b>Central de Projetos</b><span>Escolha onde trabalhar</span></div></div>
  <div class="clock" id="clock" aria-label="Hora atual"></div>
</header>

<main class="stage">
  <div class="rail" id="rail" role="listbox" aria-label="Projetos"></div>
  <div class="info" id="info" aria-live="polite"></div>
</main>

<footer class="hints"><span><kbd>←</kbd><kbd>→</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>N</kbd> novo projeto</span></footer>

<dialog id="novo" class="novo" aria-labelledby="novo-t">
  <form method="dialog" id="novo-form" autocomplete="off">
    <div class="nh"><span class="nic"><i class="pi pi-plus"></i></span><div><b id="novo-t">Novo projeto</b><span>Adiciona o projeto à Central. Os dados dele ficam aqui, não dentro da pasta do projeto.</span></div></div>
    <label>Nome<input id="n-nome" required maxlength="60" placeholder="Ex.: Meu Novo App"></label>
    <label>Pasta do projeto<input id="n-raiz" required placeholder="E:\estudos\meu-novo-app"><small>Caminho completo de uma pasta que já existe.</small></label>
    <div class="row"><label>Cor<input id="n-cor" type="color" value="#5b5cf0"></label>
      <label class="chk"><input id="n-base" type="checkbox" checked> Criar estrutura base se faltar<small><code>pendencias/</code>, <code>docs/</code>, <code>planning/</code> e <code>CLAUDE.md</code>. Nunca sobrescreve o que já existe.</small></label></div>
    <p class="err" id="n-err" role="alert" hidden></p>
    <div class="nf"><button type="button" class="b" id="n-cancel">Cancelar</button><button type="submit" class="b primary" id="n-ok"><i class="pi pi-check"></i> Adicionar</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/assets/inicio.js" nonce="__NONCE__"></script>
</body>
</html>
